grafana:
  url: "https://grafana.shinhancard.com:3000/api/ds/query"
  token: "glsa_..."           # Service Account Token
  ds_uid: "aenzqagld59fke"   # Prometheus datasource UID
  ds_id: 157                  # Prometheus datasource ID
  verify_ssl: false

  # 인스턴스 필터 구성
  # 명명 규칙: {env}{biz}{role}{number}
  # env  : pr=운영, dv=개발, te=테스트
  # biz  : aut=업무코드
  # role : ap=애플리케이션서버, db=데이터베이스
  instance:
    env: "pr"
    biz: "aut"
    roles: ["ap"]       # ap / db / [ap, db] 복수 지정 가능
    numbers: [1, 2]     # 인스턴스 번호 목록

  # 시간 범위
  window: "15m"         # PromQL 윈도우 크기 (5m / 15m / 1h)
  range_minutes: 60     # 조회 범위: 최근 N분 (기본 1시간)
  # from_ms:            # 직접 지정 시 range_minutes 무시 (epoch ms)
  # to_ms:              # 직접 지정 시 현재 시각 무시 (epoch ms)

ollama:
  url: "http://localhost:11434/api/generate"
  model: "qwen3"
  temperature: 0.3
  num_predict: 1024

# llama.cpp 모드 (Ollama 대신 llama-server 사용 시 enabled: true)
# 폐쇄망·저사양 Windows PC 데모용 — runtime/ 폴더에 llama-server.exe + 모델 파일 필요
llama_cpp:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  # 개발 환경: 절대 경로 직접 지정 (server_exe, lib_dir, model_file 을 절대 경로로)
  # 패키징 배포: 아래 두 항목 제거하면 runtime/ 폴더 기준으로 자동 탐색
  server_exe: "~/Downloads/llama-b9190/llama-server"
  lib_dir: "~/Downloads/llama-b9190"
  model_file: "~/.ollama/models/blobs/sha256-a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f"
  context_size: 4096
  threads: 4
  temperature: 0.3
  max_tokens: 512

data:
  sample_dir: "sample_data/today"
  sample_dir_yesterday: "sample_data/yesterday"
  forecast_dir: "sample_data/forecast"

thresholds:
  cpu_warning: 80.0
  cpu_critical: 95.0
  memory_warning: 85.0
  memory_critical: 95.0
  network_warning: 150.0        # Mbps — CHECK-03 Rx 기준
  network_critical: 200.0       # Mbps
  disk_read_warning: 10.0       # MB/s — CHECK-04
  disk_read_critical: 50.0      # MB/s
  process_cpu_warning: 0.5      # % — CHECK-06 (ds_agent 기준)
  process_cpu_critical: 0.8     # %
  process_mem_warning: 1.0      # % — CHECK-07 (ds_agent 기준)
  process_mem_critical: 2.0     # %

reports:
  output_dir: "reports"

templates:
  dir: "templates"
  prompt_analyze: "prompt_analyze.txt"   # LLM 분석 지시 프롬프트
  prompt_system: "prompt_system.txt"     # LLM 시스템 역할 정의
  report: "report.md.template"           # MD 리포트 양식
